name: Release Space UI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - "**.js"
      - "**.css"
      - "**.html"
      - "**.sh"
      - "**.go"
      - "**.toml"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - "space-ui.service.debian"
      - "space-ui.service.arch"
      - "space-ui.service.rhel"
  pull_request:

env:
  # telemt MTProto proxy release bundled into Linux amd64/arm64 builds
  TELEMT_VERSION: "3.5.16"

jobs:
  analyze:
    name: Analyze Go code
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Checks the translations and types and builds the v3 frontend into
      # web/app, which the build jobs embed into the binaries.
      - name: Build the frontend
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build

      - name: Upload the frontend
        uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: web/app
          retention-days: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

      - name: Run tests
        run: go test -race -shuffle=on ./...

      - name: Test against the bundled telemt release
        run: |
          TELEMT_ASSET="telemt-x86_64-linux-musl.tar.gz"
          cd /tmp
          wget -q "https://github.com/telemt/telemt/releases/download/${TELEMT_VERSION}/${TELEMT_ASSET}" \
            "https://github.com/telemt/telemt/releases/download/${TELEMT_VERSION}/${TELEMT_ASSET}.sha256"
          sha256sum -c "${TELEMT_ASSET}.sha256"
          tar -xzf "$TELEMT_ASSET" telemt
          cd -
          TELEMT_BIN=/tmp/telemt go test -count=1 -v -run TestRealTelemt ./telemt/

  build:
    needs: analyze
    # A plain push to a branch only needs the checks above: the binaries are
    # built for a release tag, for a pull request, and on demand.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - amd64
          - arm64
          - armv7
          - armv6
          - 386
          - armv5
          - s390x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download the frontend
        uses: actions/download-artifact@v5
        with:
          name: web-app
          path: web/app

      - name: Build Space UI
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          # Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
            arm64) BOOTLIN_ARCH="aarch64" ;;
            armv7) BOOTLIN_ARCH="armv7-eabihf"; export GOARCH=arm GOARM=7 ;;
            armv6) BOOTLIN_ARCH="armv6-eabihf"; export GOARCH=arm GOARM=6 ;;
            armv5) BOOTLIN_ARCH="armv5-eabi"; export GOARCH=arm GOARM=5 ;;
            386) BOOTLIN_ARCH="x86-i686" ;;
            s390x) BOOTLIN_ARCH="s390x-z13" ;;
          esac
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          curl -fL -sS -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
          cd -
          go build -ldflags "-w -s -linkmode external -extldflags '-static'" -o space-ui-release -v main.go
          file space-ui-release
          ldd space-ui-release || echo "Static binary confirmed"

          mkdir space-ui
          cp space-ui-release space-ui/
          cp space-ui.service.debian space-ui/
          cp space-ui.service.arch space-ui/
          cp space-ui.service.rhel space-ui/
          cp space-ui.sh space-ui/
          mv space-ui/space-ui-release space-ui/space-ui
          mkdir space-ui/bin
          cd space-ui/bin

          # Download dependencies
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/v26.10.31/"
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            wget -q ${Xray_URL}Xray-linux-64.zip
            unzip Xray-linux-64.zip
            rm -f Xray-linux-64.zip
          elif [ "${{ matrix.platform }}" == "arm64" ]; then
            wget -q ${Xray_URL}Xray-linux-arm64-v8a.zip
            unzip Xray-linux-arm64-v8a.zip
            rm -f Xray-linux-arm64-v8a.zip
          elif [ "${{ matrix.platform }}" == "armv7" ]; then
            wget -q ${Xray_URL}Xray-linux-arm32-v7a.zip
            unzip Xray-linux-arm32-v7a.zip
            rm -f Xray-linux-arm32-v7a.zip
          elif [ "${{ matrix.platform }}" == "armv6" ]; then
            wget -q ${Xray_URL}Xray-linux-arm32-v6.zip
            unzip Xray-linux-arm32-v6.zip
            rm -f Xray-linux-arm32-v6.zip
          elif [ "${{ matrix.platform }}" == "386" ]; then
            wget -q ${Xray_URL}Xray-linux-32.zip
            unzip Xray-linux-32.zip
            rm -f Xray-linux-32.zip
          elif [ "${{ matrix.platform }}" == "armv5" ]; then
            wget -q ${Xray_URL}Xray-linux-arm32-v5.zip
            unzip Xray-linux-arm32-v5.zip
            rm -f Xray-linux-arm32-v5.zip
          elif [ "${{ matrix.platform }}" == "s390x" ]; then
            wget -q ${Xray_URL}Xray-linux-s390x.zip
            unzip Xray-linux-s390x.zip
            rm -f Xray-linux-s390x.zip
          fi
          rm -f geoip.dat geosite.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          wget -q -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          wget -q -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          wget -q -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-${{ matrix.platform }}

          # Bundle the telemt MTProto proxy for Telegram (unmodified upstream
          # release; only published for these two architectures)
          case "${{ matrix.platform }}" in
            amd64) TELEMT_ASSET="telemt-x86_64-linux-musl.tar.gz" ;;
            arm64) TELEMT_ASSET="telemt-aarch64-linux-musl.tar.gz" ;;
            *) TELEMT_ASSET="" ;;
          esac
          if [ -n "$TELEMT_ASSET" ]; then
            TELEMT_URL="https://github.com/telemt/telemt/releases/download/${TELEMT_VERSION}"
            wget -q "${TELEMT_URL}/${TELEMT_ASSET}" "${TELEMT_URL}/${TELEMT_ASSET}.sha256"
            sha256sum -c "${TELEMT_ASSET}.sha256"
            tar -xzf "$TELEMT_ASSET" telemt
            rm -f "$TELEMT_ASSET" "${TELEMT_ASSET}.sha256"
            mv telemt telemt-linux-${{ matrix.platform }}
            chmod +x telemt-linux-${{ matrix.platform }}
            wget -q -O telemt-LICENSE "https://raw.githubusercontent.com/telemt/telemt/${TELEMT_VERSION}/LICENSE"
          fi
          cd ../..

      - name: Package
        run: tar -zcvf space-ui-linux-${{ matrix.platform }}.tar.gz space-ui

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: space-ui-linux-${{ matrix.platform }}
          path: ./space-ui-linux-${{ matrix.platform }}.tar.gz

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          # Named after the tag alone; an unnamed release is listed with the
          # tagged commit message tacked on.
          release_name: ${{ github.ref_name }}
          file: space-ui-linux-${{ matrix.platform }}.tar.gz
          asset_name: space-ui-linux-${{ matrix.platform }}.tar.gz
          overwrite: true
          prerelease: false

  # =================================
  #  Windows Build
  # =================================
  build-windows:
    name: Build for Windows
    needs: analyze
    # A plain push to a branch only needs the checks above: the binaries are
    # built for a release tag, for a pull request, and on demand.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - amd64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download the frontend
        uses: actions/download-artifact@v5
        with:
          name: web-app
          path: web/app

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-pkg-config

      - name: Build Space UI for Windows (CGO)
        shell: msys2 {0}
        run: |
          export PATH="/c/hostedtoolcache/windows/go/$(ls /c/hostedtoolcache/windows/go | sort -V | tail -n1)/x64/bin:$PATH"

          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=amd64
          export CC=x86_64-w64-mingw32-gcc

          which go
          go version
          gcc --version

          go build -ldflags "-w -s" -o space-ui-release.exe -v main.go

      - name: Copy and download resources
        shell: pwsh
        run: |
          mkdir space-ui
          Copy-Item space-ui-release.exe space-ui\space-ui.exe
          mkdir space-ui\bin
          cd space-ui\bin

          # Download Xray for Windows
          $Xray_URL = "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/"
          Invoke-WebRequest -Uri "${Xray_URL}Xray-windows-64.zip" -OutFile "Xray-windows-64.zip"
          Expand-Archive -Path "Xray-windows-64.zip" -DestinationPath .
          Remove-Item "Xray-windows-64.zip"
          Remove-Item geoip.dat, geosite.dat -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip.dat"
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite.dat"
          Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat" -OutFile "geoip_IR.dat"
          Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat" -OutFile "geosite_IR.dat"
          Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip_RU.dat"
          Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite_RU.dat"
          Rename-Item xray.exe xray-windows-amd64.exe
          cd ..
          Copy-Item -Path ..\windows_files\* -Destination . -Recurse
          cd ..

      - name: Package to Zip
        shell: pwsh
        run: |
          Compress-Archive -Path .\space-ui -DestinationPath "space-ui-windows-amd64.zip"

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: space-ui-windows-amd64
          path: ./space-ui-windows-amd64.zip

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          # Named after the tag alone; an unnamed release is listed with the
          # tagged commit message tacked on.
          release_name: ${{ github.ref_name }}
          file: space-ui-windows-amd64.zip
          asset_name: space-ui-windows-amd64.zip
          overwrite: true
          prerelease: false
